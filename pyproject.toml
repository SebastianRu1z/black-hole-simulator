[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "black-hole-physics-lab"
dynamic = ["version"]
description = "Interactive numerical laboratory for black hole physics. Work in progress."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sebastian Ruiz" }]
keywords = ["black hole", "general relativity", "orbital mechanics", "computational physics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
# The desktop interface needs Qt. The physics modules (bhlab.constants, bhlab.units,
# bhlab.formatting) import nothing outside the standard library.
dependencies = ["PySide6-Essentials>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Only needed to run the standalone scripts in prototypes/.
prototypes = ["numpy", "matplotlib"]

[tool.hatch.version]
path = "src/bhlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bhlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototypes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Physics notation uses characters such as ×, − and Greek letters on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["bhlab"]
